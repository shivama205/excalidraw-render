[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "excalidraw-render"
version = "0.1.1"
description = "Clean, deterministic, browser-free renderer for .excalidraw files (PNG/SVG)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Shivam Mathur" }]
keywords = ["excalidraw", "svg", "png", "diagram", "renderer"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Utilities",
]
dependencies = [
  "cairosvg>=2.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.5",
  "mypy>=1.10",
]

[project.scripts]
excalidraw-render = "excalidraw_render.cli:main"

[project.urls]
Homepage = "https://github.com/shivama205/excalidraw-render"
Source = "https://github.com/shivama205/excalidraw-render"
Issues = "https://github.com/shivama205/excalidraw-render/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/excalidraw_render"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # isort
  "B",             # bugbear
  "UP",            # pyupgrade
  "RUF",           # ruff-specific
  "SIM",           # simplify
  "TID",           # tidy imports
]
ignore = [
  "E501",   # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
files = ["src/excalidraw_render"]

[[tool.mypy.overrides]]
module = "cairosvg"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
